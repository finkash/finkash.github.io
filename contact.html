<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zorica Nikov</title>

    <link href="./style/style.css?v=20261024-21" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Z</div>
            <div id="menu">
                <ul>
                    <li>
                        <a href="index.html">Home</a>
                    </li>
                    <li>
                        <a href="skills.html">Skills</a>
                    </li>
                    <li>
                        <a href="photo.html">Photography</a>
                    </li>
                    <li>
                        <a href="contact.html" aria-current="page">Contact</a>
                    </li>
                </ul>
            </div>
        </header>
        <div class="content">
            <div class="banner">
                <div class="main-img" id="main-img-contact"></div>
                <div id="banner-text">Contact</div>
            </div>
            <div class="flex">
                <form action="https://formspree.io/f/xnppnejb" method="POST" id="contact-form">
                    <input type="hidden" name="_subject" value="New portfolio contact message">
                    <div class="row">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first_name" placeholder="Your first name" autocomplete="given-name" required>
                    </div>
                    
                    <div class="row">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last_name" placeholder="Your last name" autocomplete="family-name" required>
                    </div>

                    <div class="row">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Your email address" autocomplete="email" required>
                    </div>
                    
                    <div class="row">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Let's chat." required></textarea>
                    </div>

                    <div class="contact-form-actions">
                        <p class="contact-form-status" id="contact-form-status" role="status" aria-live="polite"></p>
                        <button type="submit" id="contact-submit">Contact me</button>
                    </div>
                </form>
            </div>
        </div>
        <footer>
            <div class="motivational-quote">
                "A person who does nothing will enjoy no happiness." - V.
            </div>            
            <div class="social-icons">
                <ul>
                    <li>
                        <a href="https://www.linkedin.com/in/zorica-nikov-049847272/">l-in</a>
                    </li>
                    <li>
                        <a href="https://www.instagram.com/zorica_nikov/">insta</a>
                    </li>
                    <li>
                        <a href="https://x.com/_lady_madonna_">X</a>
                    </li>
                    <li>
                        <a href="https://500px.com/p/zoricanikov?view=photos">500px</a>
                    </li>
                </ul>
            </div>
        </footer>
    </div>
    <script>
        (function () {
            'use strict';

            const form = document.getElementById('contact-form');
            const submitButton = document.getElementById('contact-submit');
            const statusMessage = document.getElementById('contact-form-status');

            form.addEventListener('submit', async function (event) {
                event.preventDefault();
                submitButton.disabled = true;
                submitButton.textContent = 'Sending...';
                statusMessage.className = 'contact-form-status';
                statusMessage.textContent = '';

                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        body: new FormData(form),
                        headers: { Accept: 'application/json' }
                    });

                    if (!response.ok) throw new Error('Form submission failed');

                    form.reset();
                    statusMessage.classList.add('is-success');
                    statusMessage.textContent = 'Thank you. Your message has been sent.';
                } catch {
                    statusMessage.classList.add('is-error');
                    statusMessage.textContent = 'Your message could not be sent. Please try again.';
                } finally {
                    submitButton.disabled = false;
                    submitButton.textContent = 'Contact me';
                }
            });
        })();
    </script>
</body>
</html>
